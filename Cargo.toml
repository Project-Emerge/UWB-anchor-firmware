[workspace]
members = ["anchor", "tag"]
resolver = "2"

[workspace.dependencies]
cortex-m = { version = "0.7.6", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
embedded-hal = "0.2.6"
embedded-hal-1 = { package = "embedded-hal", version = "1.0" }
embedded-hal-async = { version = "1.0" }
embedded-hal-bus = { version = "0.3", features = ["async"] }

# Embassy dependencies
embassy-stm32 = { version = "0.4.0", features = [ "defmt", "unstable-pac", "memory-x", "time-driver-any", "exti"] }
embassy-sync = { version = "0.7.2", features = ["defmt"] }
embassy-executor = { version = "0.9.0", features = [ "arch-cortex-m", "executor-thread", "defmt" ] }
embassy-time = { version = "0.5.0", features = [ "defmt", "defmt-timestamp-uptime", "tick-hz-32_768" ] }

# Defmt for logging
defmt = "1.0.1"
defmt-rtt = "1.0.0"

dw1000 = { git = "https://github.com/jkelleyrtp/dw1000-rs" }
dw1001 = { git = "https://github.com/jkelleyrtp/dw1000-rs" }

[workspace.dependencies.reqwest]
version = "0.11"
features = ["blocking"]

# Set the default for dependencies.
[profile.dev.package."*"]
opt-level = "s"

[profile.release]
codegen-units = 1
incremental = false
debug = true
lto = true
opt-level = "s"
