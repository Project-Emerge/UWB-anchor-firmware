# STM32L432KC configuration
[target.thumbv7em-none-eabihf]
runner = "probe-rs run --chip STM32L432KBUx"
rustflags = [
  "-C", "link-arg=--nmagic",
  "-C", "link-arg=-Tlink.x",
  "-C", "link-arg=-Tdefmt.x",
]

# STM32F103 configuration
[target.thumbv7m-none-eabi]
runner = "probe-rs run --chip STM32F103C8"
rustflags = [
  "-C", "link-arg=--nmagic",
  "-C", "link-arg=-Tlink.x",
  "-C", "link-arg=-Tdefmt.x",
]

# Default build target (STM32L432KC)
[build]
target = "thumbv7m-none-eabi"

[env]
DEFMT_LOG = "info"
#CHIPSERIE = "stm32l432"
