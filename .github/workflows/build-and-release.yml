name: Build and Release

on:
  workflow_call:
    inputs:
      release:
        description: 'Create a release'
        required: false
        default: false
        type: boolean
    secrets:
      GITHUB_TOKEN:
        required: true
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
          components: rustfmt, clippy

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build debug
        run: cargo build --verbose

      - name: Build release
        run: cargo build --release --verbose

      - name: Convert to binary format
        run: |
          cargo install cargo-binutils
          rustup component add llvm-tools-preview
          cargo objcopy --release -- -O binary target/thumbv7em-none-eabihf/release/uwb-anchor-firmware.bin

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uwb-anchor-firmware-${{ github.sha }}
          path: |
            target/thumbv7em-none-eabihf/release/uwb-anchor-firmware
            target/thumbv7em-none-eabihf/release/uwb-anchor-firmware.bin
          retention-days: 30

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release
        run: cargo build --release --verbose

      - name: Install cargo-binutils
        run: cargo install cargo-binutils

      - name: Add llvm-tools component
        run: rustup component add llvm-tools-preview

      - name: Convert to binary format
        run: |
          cargo objcopy --release -- -O binary target/thumbv7em-none-eabihf/release/uwb-anchor-firmware.bin

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create release notes
        id: release_notes
        run: |
          echo "NOTES<<EOF" >> $GITHUB_OUTPUT
          echo "## UWB Anchor Firmware v${{ steps.get_version.outputs.VERSION }}" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "### Changes" >> $GITHUB_OUTPUT
          echo "- Built from commit: \`${{ github.sha }}\`" >> $GITHUB_OUTPUT
          echo "- Target: STM32L432KC (thumbv7em-none-eabihf)" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "### Files" >> $GITHUB_OUTPUT
          echo "- \`uwb-anchor-firmware\`: ELF binary with debug symbols" >> $GITHUB_OUTPUT
          echo "- \`uwb-anchor-firmware.bin\`: Raw binary for flashing" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "### Flash Instructions" >> $GITHUB_OUTPUT
          echo "\`\`\`bash" >> $GITHUB_OUTPUT
          echo "# Using st-flash (from stlink tools)" >> $GITHUB_OUTPUT
          echo "st-flash write uwb-anchor-firmware.bin 0x8000000" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "# Using OpenOCD" >> $GITHUB_OUTPUT
          echo "openocd -f interface/stlink.cfg -f target/stm32l4x.cfg -c \"program uwb-anchor-firmware.bin 0x08000000 verify reset exit\"" >> $GITHUB_OUTPUT
          echo "\`\`\`" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "UWB Anchor Firmware v${{ steps.get_version.outputs.VERSION }}"
          body: ${{ steps.release_notes.outputs.NOTES }}
          draft: false
          prerelease: false
          files: |
            target/thumbv7em-none-eabihf/release/uwb-anchor-firmware
            target/thumbv7em-none-eabihf/release/uwb-anchor-firmware.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-audit-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-audit-

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run security audit
        run: cargo audit
